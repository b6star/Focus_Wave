<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusWave - 파일공유</title>
    <style>
        :root[data-theme="dark"] {
            --bg: #0e1014;
            --bg-gradient:
                radial-gradient(circle at 18% 12%, rgba(111, 107, 255, 0.28), transparent 28%),
                radial-gradient(circle at 82% 18%, rgba(230, 138, 134, 0.18), transparent 30%),
                linear-gradient(145deg, #0b0d13 0%, #111521 44%, #17131f 100%);
            --panel: rgba(22, 25, 31, 0.86);
            --panel2: rgba(28, 32, 39, 0.84);
            --line: rgba(255, 255, 255, 0.12);
            --txt: #f0f2f6;
            --dim: #9ba3b4;
            --a: #7c77ff;
            --a2: #e68a86;
            --a-soft: rgba(124, 119, 255, 0.16);
            --a-txt: #ffffff;
            --button-gradient: linear-gradient(135deg, #7c77ff 0%, #b06cf7 48%, #e68a86 100%);
            --button-shadow: 0 12px 26px rgba(124, 119, 255, 0.24);
            --card-shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
            --ok: #2fbf7e;
            --err: #e5484d;
        }

        :root[data-theme="light"] {
            --bg: #fff7ed;
            --bg-gradient:
                radial-gradient(circle at 16% 10%, rgba(255, 205, 161, 0.46), transparent 30%),
                radial-gradient(circle at 84% 12%, rgba(181, 170, 255, 0.34), transparent 32%),
                linear-gradient(145deg, #fff8ee 0%, #fff3e1 45%, #fffdf8 100%);
            --panel: rgba(255, 253, 248, 0.88);
            --panel2: rgba(255, 246, 233, 0.9);
            --line: rgba(128, 91, 57, 0.16);
            --txt: #28221d;
            --dim: #7b6f65;
            --a: #7568e8;
            --a2: #e8916e;
            --a-soft: rgba(232, 145, 110, 0.15);
            --a-txt: #ffffff;
            --button-gradient: linear-gradient(135deg, #7568e8 0%, #c879c8 48%, #e8916e 100%);
            --button-shadow: 0 12px 24px rgba(199, 121, 91, 0.24);
            --card-shadow: 0 18px 42px rgba(108, 74, 42, 0.12);
            --ok: #0f9d63;
            --err: #d92d20;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--txt);
            font-family: system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            -webkit-font-smoothing: antialiased;
            margin: 0;
            padding: 40px 20px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* ---------- 헤더 ---------- */
        .app-header {
            width: 100%;
            max-width: 800px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .brand { display: flex; align-items: center; gap: 11px; }

        .brand-mark {
            width: 38px; height: 38px;
            border-radius: 11px;
            display: grid; place-items: center;
            background: var(--button-gradient);
            color: #fff;
            font-weight: 700;
            font-size: 17px;
            box-shadow: var(--button-shadow);
        }

        .brand-text b { font-size: 19px; letter-spacing: -.3px; display: block; }
        .brand-text span { font-size: 11px; color: var(--dim); letter-spacing: .1em; }

        h1 { margin: 0; font-size: 19px; letter-spacing: -.3px; }
        h2 { margin: 0 0 6px; font-size: 15.5px; letter-spacing: -.2px; }

        .card > p {
            font-size: 12.8px;
            color: var(--dim);
            line-height: 1.6;
            margin: 0 0 16px;
        }

        .theme-toggle {
            margin-left: auto;
            width: auto;
            margin-top: 0;
            padding: 9px 14px;
            font-size: 12.5px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--panel), var(--panel2));
            color: var(--txt);
            border: 1px solid var(--line);
            border-radius: 9px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .theme-toggle:hover { border-color: var(--a); color: var(--a); background: var(--panel); }

        #connectionStatus {
            width: 100%;
            max-width: 800px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            padding: 10px 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: linear-gradient(135deg, var(--panel), var(--panel2));
            margin: 0 0 20px;
            box-shadow: var(--card-shadow);
        }

        /* ---------- 카드 ---------- */
        .container {
            display: none;
            flex-wrap: wrap;
            gap: 16px;
            width: 100%;
            max-width: 800px;
        }

        .card {
            background: linear-gradient(145deg, var(--panel), var(--panel2));
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 22px;
            flex: 1 0 300px;
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(18px);
        }

        @media (max-width: 700px) {
            .card { flex: 0 0 100%; }
        }

        button {
            background: var(--button-gradient);
            background-size: 180% 180%;
            color: var(--a-txt);
            border: none;
            padding: 13px 24px;
            border-radius: 10px;
            font-weight: 700;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            box-shadow: var(--button-shadow);
            transition: background-position .18s ease, filter .15s ease, transform .15s ease;
        }

        button:hover {
            background-position: 100% 50%;
            filter: brightness(1.04);
            transform: translateY(-1px);
        }

        input[type="file"] { margin-bottom: 10px; color: var(--dim); }

        input[type="text"] {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: linear-gradient(135deg, var(--panel2), var(--panel));
            color: var(--txt);
            box-sizing: border-box;
            font-size: 20px;
            letter-spacing: .35em;
            text-align: center;
            margin-top: 8px;
            outline: none;
            font-family: inherit;
        }
        input[type="text"]:focus { border-color: var(--a); }

        input[type="checkbox"] { accent-color: var(--a); width: 15px; height: 15px; }

        ul { list-style: none; padding: 0; margin: 0; }

        li {
            background: var(--panel2);
            border: 1px solid var(--line);
            margin-bottom: 8px;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        a {
            color: var(--a);
            text-decoration: none;
            font-weight: 700;
            font-size: 12.5px;
            cursor: pointer;
        }
        a:hover { text-decoration: underline; }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            flex: 1 0 180px;
            min-width: 0;
            font-size: 12.8px;
        }
        .checkbox-label input { flex: 0 0 auto; }

        .file-name { flex: 1; min-width: 0; overflow-wrap: anywhere; word-break: break-word; }

        .file-download {
            white-space: nowrap;
            min-width: fit-content;
            flex-shrink: 0;
            writing-mode: horizontal-tb;
            word-break: normal;
        }

        @media (max-width: 480px) {
            #fileList li { flex-direction: column; align-items: stretch; }
            .file-download { align-self: flex-end; }
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0 10px 0;
            gap: 10px;
        }

        .action-bar button {
            width: auto;
            margin-top: 0;
            padding: 9px 14px;
            font-size: 12.5px;
            background: linear-gradient(135deg, var(--panel2), var(--panel));
            color: var(--txt);
            border: 1px solid var(--line);
            box-shadow: none;
        }
        .action-bar button:hover { border-color: var(--a); color: var(--a); filter: none; }

        #authCard { max-width: 380px; width: 100%; margin-bottom: 20px; }

        #authStatus, #uploadStatus, #chatStatus {
            font-size: 12px;
            color: var(--dim);
            margin: 10px 0 0;
            min-height: 15px;
        }

        /* ---------- 드롭존 ---------- */
        .drop-zone {
            border: 1.5px dashed var(--line);
            border-radius: 12px;
            padding: 36px 20px;
            text-align: center;
            background:
                linear-gradient(135deg, var(--panel2), var(--panel)),
                var(--panel2);
            cursor: pointer;
            transition: border-color .15s, background .15s, transform .15s;
            margin-bottom: 15px;
        }
        .drop-zone:hover {
            border-color: var(--a);
            background: linear-gradient(135deg, var(--a-soft), var(--panel2));
            transform: translateY(-1px);
        }
        .drop-zone.dragover {
            border-color: var(--a);
            background: linear-gradient(135deg, var(--a-soft), var(--panel2));
        }
        .drop-zone p { margin: 8px 0 4px; font-size: 14px; font-weight: 600; color: var(--txt); }
        .drop-zone .dz-icon { font-size: 22px; color: var(--dim); }
        .drop-zone span { font-size: 11.5px; color: var(--dim); }

        /* ---------- 채팅 ---------- */
        .chat-card { flex: 1 1 100%; }

        .chat-window {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 320px;
            max-height: 520px;
            background: linear-gradient(145deg, var(--panel2), var(--panel));
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px;
        }

        .chat-messages {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .chat-message-row { display: flex; }
        .chat-message-row.mine { justify-content: flex-end; }
        .chat-stack {
            max-width: min(72%, 460px);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .chat-message-row.mine .chat-stack { align-items: flex-end; }
        .chat-sender {
            padding: 0 4px;
            color: var(--dim);
            font-size: 11px;
            font-weight: 700;
        }

        .chat-bubble {
            padding: 10px 13px;
            border-radius: 12px;
            background: var(--panel);
            border: 1px solid var(--line);
            color: var(--txt);
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
            cursor: pointer;
        }

        .chat-message-row.mine .chat-bubble {
            background: var(--button-gradient);
            border-color: transparent;
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: var(--button-shadow);
        }

        .chat-message-row:not(.mine) .chat-bubble { border-bottom-left-radius: 4px; }

        .chat-input-row { display: flex; align-items: flex-end; gap: 10px; }

        #chatInput {
            flex: 1;
            min-height: 46px;
            max-height: 120px;
            resize: vertical;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: linear-gradient(135deg, var(--panel), var(--panel2));
            color: var(--txt);
            padding: 13px 14px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }
        #chatInput:focus { border-color: var(--a); }

        .chat-send-button {
            width: 46px;
            height: 46px;
            margin-top: 0;
            padding: 0;
            border-radius: 10px;
            background: var(--button-gradient);
            font-size: 16px;
            flex: 0 0 auto;
        }

        @media (max-width: 560px) {
            body { padding: 24px 14px 40px; }
            .card { padding: 18px; }
            .chat-stack { max-width: 84%; }
        }
    </style>
</head>
<body>

<header class="app-header">
    <div class="brand">
        <div class="brand-mark">F</div>
        <div class="brand-text">
            <b>FocusWave</b>
            <span>LOCAL FILE SHARE</span>
        </div>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="테마 전환">
        <span id="themeIcon">🌙</span><span id="themeLabel">다크</span>
    </button>
</header>

<p id="connectionStatus">
    <span>🟡</span> 폰과 연결 확인 중...
</p>

<div id="authCard" class="card">
    <h2>인증 코드 입력</h2>
    <p>폰 화면에 표시된 6자리 인증 코드를 입력하세요.</p>

    <input type="text"
           id="authCodeInput"
           maxlength="6"
           inputmode="numeric"
           placeholder="000000">

    <button onclick="verifyCode()">접속하기</button>
    <p id="authStatus"></p>
</div>

<div class="container" id="fileShareContainer">
    <div class="card">
        <h2>파일 업로드</h2>
        <p>폰으로 보낼 파일을 선택하거나 아래 영역에 끌어다 놓으세요.</p>

        <div id="dropZone" class="drop-zone" onclick="document.getElementById('fileInput').click()">
            <div class="dz-icon">⤓</div>
            <p>여기에 파일을 놓으세요</p>
            <span>또는 클릭하여 파일 선택</span>
            <input type="file" id="fileInput" name="files" multiple style="display: none;">
        </div>

        <button onclick="uploadFile()">폰으로 전송</button>
        <p id="uploadStatus"></p>
    </div>

    <div class="card">
        <h2>파일 다운로드</h2>
        <p>현재 폰에서 공유 중인 파일 목록입니다.</p>

        <div class="action-bar">
            <label class="checkbox-label">
                <input type="checkbox" id="selectAll" onchange="toggleSelectAll()"> 전체 선택
            </label>

            <button onclick="downloadSelected()">선택 다운로드</button>
        </div>

        <ul id="fileList">
            <li>아직 불러온 파일이 없습니다.</li>
        </ul>
    </div>

    <div class="card chat-card">
        <h2>로컬 채팅</h2>
        <p>같은 Wi-Fi에 연결된 기기와 임시 메시지를 주고받는 공간입니다.</p>

        <div class="chat-window">
            <div id="chatMessages" class="chat-messages" aria-live="polite">
                <div class="chat-message-row">
                    <div class="chat-bubble">채팅 연결 준비 중입니다.</div>
                </div>
            </div>

            <div class="chat-input-row">
                <textarea id="chatInput" rows="1" placeholder="메시지 입력"></textarea>
                <button class="chat-send-button" onclick="sendChatMessage()" aria-label="메시지 보내기">➤</button>
            </div>
        </div>

        <p id="chatStatus"></p>
    </div>
</div>

<script>
    // ---------- 테마 토글 (localStorage 기억) ----------
    (function () {
        const root = document.documentElement;
        const saved = localStorage.getItem('fw-theme');
        const initial = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        applyTheme(initial);

        function applyTheme(theme) {
            root.setAttribute('data-theme', theme);
            const icon = document.getElementById('themeIcon');
            const label = document.getElementById('themeLabel');
            if (icon) icon.textContent = theme === 'dark' ? '🌙' : '☀️';
            if (label) label.textContent = theme === 'dark' ? '다크' : '라이트';
        }

        document.getElementById('themeToggle').addEventListener('click', () => {
            const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            localStorage.setItem('fw-theme', next);
            applyTheme(next);
        });
    })();
</script>

<script type="module">
    import { x25519 } from "https://esm.sh/@noble/curves@1.9.7/ed25519?bundle";
    import { cbc } from "https://esm.sh/@noble/ciphers@1.3.0/aes?bundle";
    import { hkdf } from "https://esm.sh/@noble/hashes@1.8.0/hkdf?bundle";
    import { sha256 } from "https://esm.sh/@noble/hashes@1.8.0/sha2?bundle";

    let isAuthenticated = false;
    let fileListRefreshTimer = null;
    let clientPrivateKey = null;
    let clientPublicKey = null;
    let aesKeyBytes = null;
    let trustedDeviceEvents = null;
    let chatEvents = null;
    let mySenderId = getOrCreateChatClientId();
    let trustedDeviceClaimInProgress = false;
    const textEncoder = new TextEncoder();
    const textDecoder = new TextDecoder();

    const downloadState = {};
    const renderedChatMessageIds = new Set();
    let chatMessageId = 1;

    function updateDownloadBtnUI(fileName) {
        const btn = document.querySelector(
            `.file-download[data-filename="${fileName}"]`
        )
        if (!btn) return;
        const state = downloadState[fileName];
        if (state) {
                btn.textContent = state.text;
                btn.style.color = state.color;
                btn.style.pointerEvents = state.disabled ? "none" : "auto";
        } else {
                btn.textContent = "다운로드 ⬇️";
                btn.style.color = "";
                btn.style.pointerEvents = "auto";
        }
    }

    function bytesToBase64(bytes) {
        let binary = "";
        bytes.forEach(byte => { binary += String.fromCharCode(byte); });
        return btoa(binary);
    }

    function base64ToBytes(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
    }

    function randomBytes(length) {
        const bytes = new Uint8Array(length);
        crypto.getRandomValues(bytes);
        return bytes;
    }

    function getOrCreateChatClientId() {
        const storageKey = "focuswave-chat-client-id";
        const existingId = localStorage.getItem(storageKey);
        if (existingId) return existingId;

        const newId = `web-${bytesToBase64(randomBytes(24))
            .replaceAll("+", "-")
            .replaceAll("/", "_")
            .replaceAll("=", "")}`;
        localStorage.setItem(storageKey, newId);
        return newId;
    }

    function deriveAesKey(sharedSecret) {
        return hkdf(  // HMAC-based Key Derivation Function
            sha256,  // HKDF에서 사용할 해시 함수
            sharedSecret,
            textEncoder.encode("FocusWave FileShare Salt"),   // 랜덤 Key Salt값
            textEncoder.encode("FocusWave ECDH AES-CBC v1"),  //
            32  // 출력 키 길이 32바이트 = 256비트
        );
    }

    async function setupEncryption() {
        clientPrivateKey = x25519.utils.randomPrivateKey();
        clientPublicKey = x25519.getPublicKey(clientPrivateKey);

        const response = await fetch("/crypto/exchange", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ clientPublicKey: bytesToBase64(clientPublicKey) })
        });

        if (!response.ok) throw new Error("Key exchange failed");

        const result = await response.json();
        const serverPublicKey = base64ToBytes(result.serverPublicKey);
        const sharedSecret = x25519.getSharedSecret(clientPrivateKey, serverPublicKey);

        aesKeyBytes = deriveAesKey(sharedSecret);
    }

    function pkcs7Pad(data) {
        const blockSize = 16;
        const padLength = blockSize - (data.length % blockSize);
        const padded = new Uint8Array(data.length + padLength);
        padded.set(data);
        padded.fill(padLength, data.length);
        return padded;
    }

    async function encryptFileName(fileName) {
        const nonce = randomBytes(16);
        const plainBytes = textEncoder.encode(fileName);
        if (plainBytes.length > 256) throw new Error("File name too long");
        const padded256Bytes = new Uint8Array(256);
        padded256Bytes.set(plainBytes);
        const finalPaddedBytes = pkcs7Pad(padded256Bytes);

        const aes = cbc(aesKeyBytes, nonce);
        const encryptedBytes = aes.encrypt(finalPaddedBytes);

        return {
            encryptedBase64: bytesToBase64(encryptedBytes),
            metaNonceBase64: bytesToBase64(nonce)
        };
    }

    function decryptFileName(encryptedBase64, nonceBase64) {
        const nonce = base64ToBytes(nonceBase64);
        const encryptedBytes = base64ToBytes(encryptedBase64);

        const aes = cbc(aesKeyBytes, nonce);
        const decryptedWithPadding = aes.decrypt(encryptedBytes);

        // 1. PKCS7 패딩 찌꺼기 우선 제거 (272바이트 -> 256바이트로 복원)
        const padded256Bytes = pkcs7Unpad(decryptedWithPadding);

        let actualLength = padded256Bytes.indexOf(0);
        if (actualLength === -1) actualLength = padded256Bytes.length;

        const plainBytes = padded256Bytes.slice(0, actualLength);

        return textDecoder.decode(plainBytes);
    }

    async function encryptFile(file) {
        if (!aesKeyBytes) throw new Error("암호화 키가 없습니다.");

        // 브라우저 렌더링 멈춤 방지
        await new Promise(resolve => setTimeout(resolve, 100));

        // CBC 일반적으로 16바이트 nonce 사용
        const nonce = randomBytes(16);

        // 파일 전체를 메모리에 읽음
        const plainBuffer = await file.arrayBuffer();
        const plainBytes = new Uint8Array(plainBuffer);

        // AES-CBC 암호화
        const aes = cbc(aesKeyBytes, nonce);
        const encryptedBytes = aes.encrypt(plainBytes);

        return {
            encryptedBlob: new Blob([encryptedBytes]),
            nonceBase64: bytesToBase64(nonce)
        };
    }

    function encryptChatText(message) {
        if (!aesKeyBytes) throw new Error("암호화 키가 없습니다.");

        const nonce = randomBytes(16);
        const aes = cbc(aesKeyBytes, nonce);
        const encryptedBytes = aes.encrypt(textEncoder.encode(JSON.stringify({
            clientId: mySenderId,
            message
        })));

        return {
            nonceBase64: bytesToBase64(nonce),
            encryptedBase64: bytesToBase64(encryptedBytes)
        };
    }

    function decryptChatJson(nonceBase64, encryptedBase64) {
        if (!aesKeyBytes) throw new Error("암호화 키가 없습니다.");

        const nonce = base64ToBytes(nonceBase64);
        const encryptedBytes = base64ToBytes(encryptedBase64);
        const aes = cbc(aesKeyBytes, nonce);
        const plainBytes = aes.decrypt(encryptedBytes);

        return JSON.parse(textDecoder.decode(plainBytes));
    }

    function pkcs7Unpad(data) {
        const padLength = data[data.length - 1];

        if (padLength < 1 || padLength > 16) {
            throw new Error("Invalid padding");
        }

        return data.slice(0, data.length - padLength);
    }

    // 💡 btnElement 파라미터 삭제
    async function downloadEncryptedFile(fileName) {
        if (!aesKeyBytes) {
            alert("보안 연결이 끊어졌습니다. 다시 인증해주세요.");
            resetAuth();
            return;
        }

        const metaCrypto = await encryptFileName(fileName);

        const encryptedUrlParam = encodeURIComponent(metaCrypto.encryptedBase64);
        const nonceUrlParam = encodeURIComponent(metaCrypto.metaNonceBase64);

        // 💡 장부 기록 및 UI 업데이트
        downloadState[fileName] = { text: "요청 중... ⏳", color: "#f59e0b", disabled: true };
        updateDownloadBtnUI(fileName);

        const response = await fetch(`/download/${encryptedUrlParam}?nonce=${nonceUrlParam}`, {
            method: "GET",
            credentials: "same-origin"
        });

        if (!response.ok) {
            alert(`다운로드 실패: ${response.status}`);
            downloadState[fileName] = { text: "실패 ❌", color: "#e5484d", disabled: true };
            updateDownloadBtnUI(fileName);
            return;
        }

        const nonceBase64 = response.headers.get("X-FocusWave-Nonce");
        if (!nonceBase64) {
            alert("다운로드 복호화 정보가 없습니다.");
            return;
        }
        const metaEncryptedBase64 = response.headers.get("X-File-Name-Encrypted");
        const metaNonceBase64 = response.headers.get("X-Meta-Nonce");

        let actualFileName = fileName;
        if (metaEncryptedBase64 && metaNonceBase64) {
            try {
                actualFileName = decryptFileName(metaEncryptedBase64, metaNonceBase64);
            } catch (e) {
                console.error("파일명 복호화 에러:", e);
            }
        }

        const nonce = base64ToBytes(nonceBase64);
        const contentLength = response.headers.get('Content-Length');
        const totalBytes = parseInt(contentLength, 10);
        let loadedBytes = 0;

        const reader = response.body.getReader();
        const chunks = [];

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            chunks.push(value);
            loadedBytes += value.length;

            const percent = Math.round((loadedBytes / totalBytes) * 100);

            // 💡 퍼센트 업데이트
            downloadState[fileName] = { text: `다운로드 중 ${percent}%`, color: "#f59e0b", disabled: true };
            updateDownloadBtnUI(fileName);
        }

        const encryptedBytes = new Uint8Array(loadedBytes);
        let offset = 0;
        for (const chunk of chunks) {
            encryptedBytes.set(chunk, offset);
            offset += chunk.length;
        }

        try {
            const aes = cbc(aesKeyBytes, nonce);
            const paddedPlainBytes = aes.decrypt(encryptedBytes);

            // 주석 유지
            //const plainBytes = pkcs7Unpad(paddedPlainBytes);
            const plainBytes = paddedPlainBytes;

            const blob = new Blob([plainBytes], {
                type: response.headers.get("Content-Type") || "application/octet-stream"
            });

            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = actualFileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            downloadState[fileName] = { text: "다운로드 ✅", color: "#2fbf7e", disabled: false };
            updateDownloadBtnUI(fileName);

        } catch (error) {
            console.error("복호화 중 에러 발생:", error);
            downloadState[fileName] = { text: "에러 ❌", color: "#e5484d", disabled: true };
            updateDownloadBtnUI(fileName);
        }
    }

    async function verifyCode() {
        const codeInput = document.getElementById('authCodeInput');
        const authStatus = document.getElementById('authStatus');
        const code = codeInput.value.trim();

        if (code.length !== 6) {
            authStatus.innerText = "6자리 인증 코드를 입력해주세요.";
            return;
        }

        authStatus.innerText = "인증 중...";

        try {
            const response = await fetch('/auth', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: code })
            });

            if (response.ok) {
                await response.json();
                authStatus.innerText = "보안 연결 설정 중...";
                await setupEncryption();
                enterAuthenticatedState();

            } else {
                let errorData;
                try {
                    errorData = await response.json();
                } catch (e) {
                    errorData = null;
                }

                if (errorData && errorData.message) {
                    authStatus.innerText = errorData.message;
                } else {
                    if (response.status === 401) {
                        authStatus.innerText = "인증 코드가 올바르지 않습니다.";
                    } else if (response.status === 403) {
                        authStatus.innerText = "영구 차단됨: 서버가 재시작될 때까지 접속할 수 없습니다.";
                    } else if (response.status === 429) {
                        authStatus.innerText = "요청 횟수 초과: 1분 뒤에 다시 시도해주세요.";
                    } else {
                        authStatus.innerText = `인증 실패: 서버 에러 (${response.status})`;
                    }
                }
            }
        } catch (error) {
            authStatus.innerText = "서버(폰)에 연결할 수 없습니다. Wi-Fi 상태를 확인해 주세요.";
        }
    }

    async function uploadFile() {
        if (!isAuthenticated) {
            alert("먼저 인증 코드를 입력해주세요.");
            return;
        }

        const fileInput = document.getElementById('fileInput');
        const statusText = document.getElementById('uploadStatus');
        const files = Array.from(fileInput.files);

        if (files.length === 0) {
            alert("파일을 먼저 선택해주세요!");
            return;
        }

        let successCount = 0;

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const success = await uploadOneFile(file, i + 1, files.length, statusText);
            if (!success) return;
            successCount++;
        }

        statusText.innerText = `${successCount}개 파일 전송 성공!`;
        fileInput.value = "";
        fetchFileList();
    }

    function uploadOneFile(file, currentIndex, totalCount, statusText) {
        return new Promise(async (resolve) => {
            try {
                if (!aesKeyBytes) {
                    statusText.innerText = "보안 연결이 끊어졌습니다. 다시 인증해주세요.";
                    resetAuth();
                    return resolve(false);
                }

                statusText.innerText = `전송 준비 및 암호화 중... (${currentIndex}/${totalCount}) ${file.name}`;

                const metaCrypto = await encryptFileName(file.name);

                // 1. PC 메모리에서 통짜 암호화 수행
                const encryptedFile = await encryptFile(file);

                const xhr = new XMLHttpRequest();
                xhr.open("POST", "/upload", true); // URL 파라미터 다 뺍니다.
                xhr.withCredentials = true;

                // 💡 2. 코틀린 서버가 읽을 수 있도록 메타데이터를 HTTP 헤더에 쌩으로 실어줍니다.
                xhr.setRequestHeader("Content-Type", "application/octet-stream"); // 멀티파트 아님!
                xhr.setRequestHeader("X-File-Name-Encrypted", metaCrypto.encryptedBase64);
                xhr.setRequestHeader("X-Meta-Nonce", metaCrypto.metaNonceBase64);
                xhr.setRequestHeader("X-FocusWave-Nonce", encryptedFile.nonceBase64);

                xhr.upload.onprogress = function (event) {
                    if (event.lengthComputable) {
                        const percent = Math.round((event.loaded / event.total) * 100);
                        statusText.innerText = `전송 중... (${currentIndex}/${totalCount}) ${file.name} - ${percent}%`;
                    }
                };

                xhr.onload = function () {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        statusText.innerText = `전송 완료! (${currentIndex}/${totalCount}) ${file.name}`;
                        resolve(true);
                    } else {
                        statusText.innerText = `전송 실패: 서버 에러 (${xhr.status})`;
                        resolve(false);
                    }
                };

                xhr.onerror = function () {
                    statusText.innerText = `서버 연결 실패`;
                    resolve(false);
                };

                // 💡 FormData로 감싸지 않고 암호화된 순수 덩어리(Blob)만 네트워크로 밀어 넣습니다.
                xhr.send(encryptedFile.encryptedBlob);

            } catch (error) {
                statusText.innerText = `암호화 또는 전송 실패`;
                resolve(false);
            }
        });
    }

    async function fetchFileList() {
        if (!isAuthenticated) return;

        const listElement = document.getElementById('fileList');
        const selectAllCheckbox = document.getElementById('selectAll');

        try {
            const response = await fetch('/list', { credentials: 'same-origin' });

            if (response.ok) {
                const files = await response.json();

                const checkedFiles = Array.from(document.querySelectorAll('.file-checkbox:checked')).map(cb => cb.value);
                const isSelectAllchecked = selectAllCheckbox ? selectAllCheckbox.checked : false;

                listElement.innerHTML = "";

                if (selectAllCheckbox) selectAllCheckbox.checked = isSelectAllchecked;

                if (files.length === 0) {
                    listElement.innerHTML = "<li>폰에 공유 중인 파일이 없습니다.</li>";
                    return;
                }

                files.slice().reverse().forEach(fileName => {
                    const li = document.createElement('li');
                    const label = document.createElement('label');
                    label.className = "checkbox-label";

                    const checkbox = document.createElement('input');
                    checkbox.type = "checkbox";
                    checkbox.className = "file-checkbox";
                    checkbox.value = fileName;

                    if (checkedFiles.includes(fileName)) {
                        checkbox.checked = true;
                    }

                    const fileNameText = document.createElement('span');
                    fileNameText.className = "file-name";
                    fileNameText.textContent = fileName;

                    label.appendChild(checkbox);
                    label.appendChild(fileNameText);

                    const downloadBtn = document.createElement('a');
                    downloadBtn.href = "#";
                    downloadBtn.textContent = "다운로드 ⬇️";
                    downloadBtn.className = "file-download";

                    downloadBtn.setAttribute('data-filename', fileName);
                    const state = downloadState[fileName];
                    if (state) {
                        downloadBtn.textContent = state.text;
                        downloadBtn.style.color = state.color;
                        downloadBtn.style.pointerEvents = state.disabled ? "none" : "auto";
                    }

                    downloadBtn.onclick = function (event) {
                        event.preventDefault();
                        downloadEncryptedFile(fileName);
                    };

                    li.appendChild(label);
                    li.appendChild(downloadBtn);
                    listElement.appendChild(li);
                });
            } else if (response.status === 401 || response.status === 403) {
                listElement.innerHTML = "<li>인증이 만료되었거나 권한이 없습니다.</li>";
                resetAuth();
            } else {
                listElement.innerHTML = "<li>파일 목록을 가져오지 못했습니다.</li>";
            }
        } catch (error) {
            listElement.innerHTML = "<li>서버(폰)에서 목록을 가져올 수 없습니다.</li>";
        }
    }

    async function checkConnection() {
        const statusElement = document.getElementById('connectionStatus');
        const ipAddress = window.location.hostname || "로컬";

        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 2000);
            const response = await fetch('/ping', { signal: controller.signal });
            clearTimeout(timeoutId);

            if (response.ok) {
                statusElement.innerHTML = `<span>🟢</span> 폰(${ipAddress})과 정상적으로 연결됨`;
                statusElement.style.color = "var(--ok)";
            } else {
                throw new Error("서버 응답 오류");
            }
        } catch (error) {
            statusElement.innerHTML = `<span>🔴</span> 폰(${ipAddress})과 연결이 끊어졌습니다!`;
            statusElement.style.color = "var(--err)";
        }
    }

        const chatMessages = document.getElementById('chatMessages');

        chatMessageId = 1;
        renderedChatMessageIds.clear();

    function appendChatPlaceholder(text) {
        const chatMessages = document.getElementById('chatMessages');
        if (!chatMessages) return;

        const row = document.createElement('div');
        row.className = "chat-message-row";
        row.dataset.messageId = String(chatMessageId++);

        const bubble = document.createElement('div');
        bubble.className = "chat-bubble";
        bubble.textContent = text;

        row.appendChild(bubble);
        chatMessages.appendChild(row);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function appendChatMessage(message) {
        const chatMessages = document.getElementById('chatMessages');
        if (!chatMessages) return;
        if (message.id && renderedChatMessageIds.has(message.id)) return;
        if (message.id) renderedChatMessageIds.add(message.id);

        const isMine = message.senderId === mySenderId;
        const row = document.createElement('div');
        row.className = isMine ? "chat-message-row mine" : "chat-message-row";
        row.dataset.messageId = message.id || String(chatMessageId++);

        const stack = document.createElement('div');
        stack.className = "chat-stack";

        if (!isMine) {
            const sender = document.createElement('div');
            sender.className = "chat-sender";
            sender.textContent = message.senderName || "Unknown";
            stack.appendChild(sender);
        }

        const bubble = document.createElement('div');
        bubble.className = "chat-bubble";
        bubble.textContent = message.message || "";
        bubble.onclick = () => showChatMessageDetail(message);

        stack.appendChild(bubble);
        row.appendChild(stack);
        chatMessages.appendChild(row);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showChatMessageDetail(message) {
        const timeText = message.sentAtMillis
            ? new Date(message.sentAtMillis).toLocaleString()
            : "-";
        alert(
            `이름: ${message.senderName || "-"}\n` +
            `IP: ${message.senderIpAddress || "-"}\n` +
            `환경: ${message.senderUserAgent || "-"}\n` +
            `순서: ${message.sequence || "-"}\n` +
            `서버 수신 시간: ${timeText}`
        );
    }

    async function fetchChatMessages() {
        const chatMessages = document.getElementById('chatMessages');
        const chatStatus = document.getElementById('chatStatus');

        try {
            const response = await fetch("/chat/messages", {
                method: "GET",
                credentials: "same-origin"
            });

            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const envelope = await response.json();
            const messages = decryptChatJson(envelope.nonce, envelope.payload);

            if (chatMessages) chatMessages.innerHTML = "";
            renderedChatMessageIds.clear();
            if (messages.length === 0) {
                appendChatPlaceholder("아직 메시지가 없습니다.");
            } else {
                messages.forEach(appendChatMessage);
            }
            if (chatStatus) chatStatus.innerText = "채팅 연결됨";
        } catch (error) {
            console.error("채팅 목록 로드 실패:", error);
            if (chatStatus) chatStatus.innerText = "채팅 목록을 불러오지 못했습니다.";
        }
    }

    async function sendChatMessage() {
        if (!isAuthenticated) {
            alert("먼저 인증 코드를 입력해주세요.");
            return;
        }

        const chatInput = document.getElementById('chatInput');
        const chatStatus = document.getElementById('chatStatus');
        if (!chatInput) return;

        const message = chatInput.value.trim();
        if (!message) return;

        try {
            const encryptedMessage = encryptChatText(message);

            const response = await fetch("/chat/send", {
                method: "POST",
                credentials: "same-origin",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    nonce: encryptedMessage.nonceBase64,
                    message: encryptedMessage.encryptedBase64
                })
            });

            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            chatInput.value = "";
            if (chatStatus) chatStatus.innerText = "전송됨";
        } catch (error) {
            console.error("채팅 전송 실패:", error);
            if (chatStatus) chatStatus.innerText = "메시지 전송 실패";
        }
    }

    function startChatEvents() {
        if (chatEvents !== null) {
            chatEvents.close();
        }

        chatEvents = new EventSource("/chat/events");

        chatEvents.onopen = () => {
            const chatStatus = document.getElementById('chatStatus');
            if (chatStatus) chatStatus.innerText = "채팅 실시간 연결됨";
        };

        chatEvents.addEventListener("chat-message", (event) => {
            try {
                const envelope = JSON.parse(event.data);
                const message = decryptChatJson(envelope.nonce, envelope.payload);
                const chatMessages = document.getElementById('chatMessages');
                if (chatMessages && chatMessages.textContent === "아직 메시지가 없습니다.") {
                    chatMessages.innerHTML = "";
                }
                appendChatMessage(message);
            } catch (error) {
                console.error("채팅 이벤트 처리 실패:", error);
            }
        });

        chatEvents.onerror = () => {
            const chatStatus = document.getElementById('chatStatus');
            if (chatStatus) chatStatus.innerText = "채팅 실시간 연결 끊김";
        };
    }

    function startTrustedDeviceEvents() {
        if (trustedDeviceEvents !== null) {
            trustedDeviceEvents.close();
        }
        trustedDeviceClaimInProgress = false;
        trustedDeviceEvents = new EventSource("/trusted-device/events");

        trustedDeviceEvents.onopen = () => {
            console.info("Trusted device event stream connected");
        };

        trustedDeviceEvents.addEventListener("trusted-device-approved", (event) => {
            console.info("Trusted device approved event received:", event.data);
            claimTrustedDevice();
        });

        trustedDeviceEvents.onmessage = (event) => {
            console.info("Trusted device event message received:", event.data);
            try {
                const data = JSON.parse(event.data);
                if (data.type === "trusted-device-approved") {
                    claimTrustedDevice();
                }
            } catch (error) {
                console.info("Trusted device event message ignored:", event.data);
            }
        };

        trustedDeviceEvents.onerror = () => {
            console.error("Trusted device event stream disconnected");
        };
    }

    async function claimTrustedDevice() {
        if (trustedDeviceClaimInProgress) return;
        trustedDeviceClaimInProgress = true;

        try {
            const response = await fetch("/trusted-device/claim", {
                method: "POST",
                credentials: "same-origin"
            });

            if (!response.ok) {
                console.error("Trusted device claim failed:", response.status);
                trustedDeviceClaimInProgress = false;
            } else {
                console.info("Trusted device claim succeeded");
            }
        } catch (error) {
            console.error("Trusted device claim failed:", error);
            trustedDeviceClaimInProgress = false;
        }
    }

            uploadStatus.style.color = "var(--ok)";
        }
    });

    // 클릭해서 파일을 선택했을 때도 피드백을 주기 위한 이벤트
    fileInput.addEventListener('change', () => {
        if (fileInput.files.length > 0) {
            uploadStatus.innerText = `${fileInput.files.length}개의 파일이 선택되었습니다. 전송을 눌러주세요.`;
            uploadStatus.style.color = "var(--ok)";
        }
    });

    const chatInput = document.getElementById('chatInput');
    if (chatInput) {
        chatInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendChatMessage();
            }
        });
    }
    // ------------------------------------
</script>
</body>
</html>
