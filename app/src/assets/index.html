<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusWave - 파일공유</title>
    <style>
        body {
            background-color: #1E1E2E;
            color: #FFFFFF;
            font-family: 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: #8A86E6; }

        .container {
            display: none;
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            flex: 1;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        button {
            background-color: #E68A86;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }

        button:hover { background-color: #d87b77; }

        input[type="file"] {
            margin-bottom: 10px;
            color: #ccc;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            box-sizing: border-box;
            font-size: 18px;
            text-align: center;
            margin-top: 8px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background-color: rgba(0, 0, 0, 0.2);
            margin-bottom: 8px;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        a {
            color: #8A86E6;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        a:hover { text-decoration: underline; }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            flex: 1 1 180px;
            min-width: 0;
        }

        .checkbox-label input {
            flex: 0 0 auto;
        }

        .file-name {
            flex: 1;
            min-width: 0;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .file-download {
            white-space: nowrap;
            min-width: fit-content;
            flex-shrink: 0;
            writing-mode: horizontal-tb;
            word-break: normal;
        }

        @media (max-width: 480px) {
            #fileList li {
                flex-direction: column;
                align-items: stretch;
            }

            .file-download {
                align-self: flex-end;
            }
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0 10px 0;
        }

        #authCard {
            max-width: 360px;
            width: 100%;
            margin-bottom: 20px;
        }

        #authStatus,
        #uploadStatus {
            font-size: 12px;
            color: #E68A86;
        }
    </style>
</head>
<body>

<h1>🚀 Focus Wave 파일공유</h1>

<p id="connectionStatus" style="font-size: 18px; font-weight: bold; color: #FFD700;">
    🟡 폰과 연결 확인 중...
</p>

<div id="authCard" class="card">
    <h2>🔐 인증 코드 입력</h2>
    <p>폰 화면에 표시된 6자리 인증 코드를 입력하세요.</p>

    <input
            type="text"
            id="authCodeInput"
            maxlength="6"
            inputmode="numeric"
            placeholder="예: 123456"
    >

    <button onclick="verifyCode()">접속하기</button>
    <p id="authStatus"></p>
</div>

<div class="container" id="fileShareContainer">
    <div class="card">
        <h2>💻 PC ➡️ 📱 폰</h2>
        <p>폰으로 보낼 파일을 여러 개 선택할 수 있습니다.</p>

        <input type="file" id="fileInput" name="files" multiple>
        <button onclick="uploadFile()">🚀 폰으로 전송</button>
        <p id="uploadStatus"></p>
    </div>

    <div class="card">
        <h2>📱 폰 ➡️ 💻 PC</h2>
        <p>현재 폰에서 공유 중인 파일 목록입니다.</p>

        <div class="action-bar">
            <label class="checkbox-label">
                <input type="checkbox" id="selectAll" onchange="toggleSelectAll()"> 전체 선택
            </label>

            <button onclick="downloadSelected()" style="width: auto; margin-top: 0; padding: 8px 16px;">
                선택 다운로드 ⬇️
            </button>
        </div>

        <ul id="fileList">
            <li>아직 불러온 파일이 없습니다.</li>
        </ul>
    </div>
</div>

<script type="module">
    import { x25519 } from "https://esm.sh/@noble/curves@1.9.7/ed25519?bundle";
    import { cbc } from "https://esm.sh/@noble/ciphers@1.3.0/aes?bundle"; //
    import { hkdf } from "https://esm.sh/@noble/hashes@1.8.0/hkdf?bundle";
    import { sha256 } from "https://esm.sh/@noble/hashes@1.8.0/sha2?bundle";

        let isAuthenticated = false;
        let fileListRefreshTimer = null;
        let clientPrivateKey = null;
        let clientPublicKey = null;
        let aesKeyBytes = null;
        const textEncoder = new TextEncoder();

        function bytesToBase64(bytes) {
            let binary = "";
            bytes.forEach(byte => { binary += String.fromCharCode(byte); });
            return btoa(binary);
        }

        function base64ToBytes(base64) {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes;
        }

        function randomBytes(length) {
            const bytes = new Uint8Array(length);
            crypto.getRandomValues(bytes);
            return bytes;
        }

        function deriveAesKey(sharedSecret) {
            return hkdf(
                sha256,
                sharedSecret,
                textEncoder.encode("FocusWave FileShare Salt"),
                textEncoder.encode("FocusWave ECDH AES-GCM v1"),
                32
            );
        }

        async function setupEncryption() {
            clientPrivateKey = x25519.utils.randomPrivateKey();
            clientPublicKey = x25519.getPublicKey(clientPrivateKey);

            const response = await fetch("/crypto/exchange", {
                method: "POST",
                credentials: "same-origin",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ clientPublicKey: bytesToBase64(clientPublicKey) })
            });

            if (!response.ok) throw new Error("Key exchange failed");

            const result = await response.json();
            const serverPublicKey = base64ToBytes(result.serverPublicKey);
            const sharedSecret = x25519.getSharedSecret(clientPrivateKey, serverPublicKey);

            aesKeyBytes = deriveAesKey(sharedSecret);
        }



function pkcs7Pad(data) {
    const blockSize = 16;
    const padLength = blockSize - (data.length % blockSize);
    const padded = new Uint8Array(data.length + padLength);
    padded.set(data);
    padded.fill(padLength, data.length);
    return padded;
}


async function encryptFile(file) {
    if (!aesKeyBytes) throw new Error("암호화 키가 없습니다.");

    // 브라우저 렌더링 멈춤 방지
    await new Promise(resolve => setTimeout(resolve, 100));

    // CBC 모드는 16바이트 IV를 사용합니다.
    const iv = randomBytes(16);
    const plainBuffer = await file.arrayBuffer();
    const plainBytes = new Uint8Array(plainBuffer);

    // 데이터 길이를 16배수로 맞추기 위해 패딩 적용
    const paddedBytes = pkcs7Pad(plainBytes);

    // noble/ciphers의 cbc 모드 적용
    const aes = cbc(aesKeyBytes, iv);
    const encryptedBytes = aes.encrypt(paddedBytes);

    return {
        encryptedBlob: new Blob([encryptedBytes]),
        nonceBase64: bytesToBase64(iv)
    };
}

        async function verifyCode() {
            const codeInput = document.getElementById('authCodeInput');
            const authStatus = document.getElementById('authStatus');
            const authCard = document.getElementById('authCard');
            const fileShareContainer = document.getElementById('fileShareContainer');
            const code = codeInput.value.trim();

            if (code.length !== 6) {
                authStatus.innerText = "6자리 인증 코드를 입력해주세요.";
                return;
            }

            authStatus.innerText = "인증 중...";

            try {
                const response = await fetch('/auth', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code })
                });

                if (response.ok) {
                    authStatus.innerText = "보안 연결 설정 중...";
                    await setupEncryption();

                    isAuthenticated = true;
                    clearFileShareUi();
                    authCard.style.display = "none";
                    fileShareContainer.style.display = "flex";

                    fetchFileList();

                    if (fileListRefreshTimer !== null) {
                        clearInterval(fileListRefreshTimer);
                    }

                    fileListRefreshTimer = setInterval(() => {
                        fetchFileList();
                    }, 2000);

                } else {
                    let errorData;
                    try {
                        errorData = await response.json();
                    } catch (e) {
                        errorData = null;
                    }

                    if (errorData && errorData.message) {
                        authStatus.innerText = errorData.message;
                    } else {
                        if (response.status === 401) {
                            authStatus.innerText = "인증 코드가 올바르지 않습니다.";
                        } else if (response.status === 403) {
                            authStatus.innerText = "영구 차단됨: 서버가 재시작될 때까지 접속할 수 없습니다.";
                        } else if (response.status === 429) {
                            authStatus.innerText = "요청 횟수 초과: 1분 뒤에 다시 시도해주세요.";
                        } else {
                            authStatus.innerText = `인증 실패: 서버 에러 (${response.status})`;
                        }
                    }
                }
            } catch (error) {
                authStatus.innerText = "서버(폰)에 연결할 수 없습니다. Wi-Fi 상태를 확인해 주세요.";
            }
        }

        async function uploadFile() {
            if (!isAuthenticated) {
                alert("먼저 인증 코드를 입력해주세요.");
                return;
            }

            const fileInput = document.getElementById('fileInput');
            const statusText = document.getElementById('uploadStatus');
            const files = Array.from(fileInput.files);

            if (files.length === 0) {
                alert("파일을 먼저 선택해주세요!");
                return;
            }

            let successCount = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const success = await uploadOneFile(file, i + 1, files.length, statusText);
                if (!success) return;
                successCount++;
            }

            statusText.innerText = `${successCount}개 파일 전송 성공!`;
            fileInput.value = "";
            fetchFileList();
        }

        function uploadOneFile(file, currentIndex, totalCount, statusText) {
            return new Promise(async (resolve) => {
                try {
                    if (!aesKeyBytes) {
                        statusText.innerText = "보안 연결이 끊어졌습니다. 다시 인증해주세요.";
                        resetAuth();
                        return resolve(false);
                    }

                    statusText.innerText = `전송 준비 및 암호화 중... (${currentIndex}/${totalCount}) ${file.name} (화면이 멈출 수 있습니다)`;

                    // 전송 전 암호화 수행
                    const encryptedFile = await encryptFile(file);

                    const formData = new FormData();
                    formData.append("files", encryptedFile.encryptedBlob, file.name + ".enc");
                    formData.append("fileName_0", file.name);
                    formData.append("nonce", encryptedFile.nonceBase64);
                    formData.append("encrypted", "true");

                    const xhr = new XMLHttpRequest();
                    xhr.open("POST", `/upload?fileName=${encodeURIComponent(file.name)}`, true);
                    xhr.withCredentials = true;

                    xhr.upload.onprogress = function (event) {
                        if (event.lengthComputable) {
                            const percent = Math.round((event.loaded / event.total) * 100);
                            statusText.innerText = `전송 중... (${currentIndex}/${totalCount}) ${file.name} - ${percent}%`;
                        } else {
                            statusText.innerText = `전송 중... (${currentIndex}/${totalCount}) ${file.name}`;
                        }
                    };

                    xhr.onload = function () {
                        if (xhr.status >= 200 && xhr.status < 300) {
                            statusText.innerText = `전송 완료... (${currentIndex}/${totalCount}) ${file.name}`;
                            resolve(true);
                        } else if (xhr.status === 401 || xhr.status === 403) {
                            statusText.innerText = "인증이 만료되었거나 권한이 없습니다.";
                            resetAuth();
                            resolve(false);
                        } else {
                            statusText.innerText = `전송 실패: 서버 에러 (${xhr.status}) - ${file.name}`;
                            resolve(false);
                        }
                    };

                    xhr.onerror = function () {
                        statusText.innerText = `서버에 연결할 수 없습니다. - ${file.name}`;
                        resolve(false);
                    };

                    xhr.send(formData);

                } catch (error) {
                    statusText.innerText = `암호화 또는 전송 실패 - ${file.name}`;
                    resolve(false);
                }
            });
        }

        function toggleSelectAll() {
            const selectAllCheckbox = document.getElementById('selectAll');
            const checkboxes = document.querySelectorAll('.file-checkbox');

            checkboxes.forEach(cb => {
                cb.checked = selectAllCheckbox.checked;
            });
        }

        function downloadSelected() {
            if (!isAuthenticated) {
                alert("먼저 인증 코드를 입력해주세요.");
                return;
            }

            const checkboxes = document.querySelectorAll('.file-checkbox:checked');

            if (checkboxes.length === 0) {
                alert("다운로드할 파일을 체크해주세요!");
                return;
            }

            checkboxes.forEach((cb, index) => {
                setTimeout(() => {
                    const a = document.createElement('a');
                    a.href = `/download/${encodeURIComponent(cb.value)}`;
                    a.download = cb.value;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                }, index * 300);
            });
        }

        async function fetchFileList() {
            if (!isAuthenticated) return;

            const listElement = document.getElementById('fileList');
            const selectAllCheckbox = document.getElementById('selectAll');

            try {
                const response = await fetch('/list', { credentials: 'same-origin' });

                if (response.ok) {
                    const files = await response.json();
                    listElement.innerHTML = "";

                    if (selectAllCheckbox) selectAllCheckbox.checked = false;

                    if (files.length === 0) {
                        listElement.innerHTML = "<li>폰에 공유 중인 파일이 없습니다.</li>";
                        return;
                    }

                    files.slice().reverse().forEach(fileName => {
                        const li = document.createElement('li');
                        const label = document.createElement('label');
                        label.className = "checkbox-label";

                        const checkbox = document.createElement('input');
                        checkbox.type = "checkbox";
                        checkbox.className = "file-checkbox";
                        checkbox.value = fileName;

                        const fileNameText = document.createElement('span');
                        fileNameText.className = "file-name";
                        fileNameText.textContent = fileName;

                        label.appendChild(checkbox);
                        label.appendChild(fileNameText);

                        const downloadBtn = document.createElement('a');
                        downloadBtn.href = `/download/${encodeURIComponent(fileName)}`;
                        downloadBtn.textContent = "다운로드 ⬇️";
                        downloadBtn.download = fileName;
                        downloadBtn.className = "file-download";

                        li.appendChild(label);
                        li.appendChild(downloadBtn);
                        listElement.appendChild(li);
                    });
                } else if (response.status === 401 || response.status === 403) {
                    listElement.innerHTML = "<li>인증이 만료되었거나 권한이 없습니다.</li>";
                    resetAuth();
                } else {
                    listElement.innerHTML = "<li>파일 목록을 가져오지 못했습니다.</li>";
                }
            } catch (error) {
                listElement.innerHTML = "<li>서버(폰)에서 목록을 가져올 수 없습니다.</li>";
            }
        }

        async function checkConnection() {
            const statusElement = document.getElementById('connectionStatus');
            const ipAddress = window.location.hostname || "로컬";

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2000);
                const response = await fetch('/ping', { signal: controller.signal });
                clearTimeout(timeoutId);

                if (response.ok) {
                    statusElement.innerHTML = `🟢 폰(${ipAddress})과 정상적으로 연결됨`;
                    statusElement.style.color = "#4CAF50";
                } else {
                    throw new Error("서버 응답 오류");
                }
            } catch (error) {
                statusElement.innerHTML = `🔴 폰(${ipAddress})과 연결이 끊어졌습니다!`;
                statusElement.style.color = "#F44336";
            }
        }

        function resetAuth() {
            isAuthenticated = false;
            clientPrivateKey = null;
            clientPublicKey = null;
            aesKeyBytes = null;

            if (fileListRefreshTimer !== null) {
                clearInterval(fileListRefreshTimer);
                fileListRefreshTimer = null;
            }
            clearFileShareUi();

            document.getElementById('authCard').style.display = "block";
            document.getElementById('fileShareContainer').style.display = "none";
            document.getElementById('authCodeInput').value = "";
            document.getElementById('authStatus').innerText = "다시 인증해주세요.";
        }

        function clearFileShareUi() {
            const fileInput = document.getElementById('fileInput');
            const uploadStatus = document.getElementById('uploadStatus');
            const fileList = document.getElementById('fileList');
            const selectAllCheckbox = document.getElementById('selectAll');

            if (fileInput) fileInput.value = "";
            if (uploadStatus) uploadStatus.innerText = "";
            if (selectAllCheckbox) selectAllCheckbox.checked = false;

            if (fileList) {
                fileList.innerHTML = "<li>아직 불러온 파일이 없습니다.</li>";
            }
        }

        document.getElementById('authCodeInput').addEventListener('keyup', function (event) {
            if (event.key === "Enter") {
                verifyCode();
            }
        });

        window.verifyCode = verifyCode;
        window.uploadFile = uploadFile;
        window.toggleSelectAll = toggleSelectAll;
        window.downloadSelected = downloadSelected;

        checkConnection();
        setInterval(checkConnection, 3000);
</script>
</body>
</html>
