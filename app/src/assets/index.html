<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusWave - 파일공유</title>
    <style>
        body {
            background-color: #1E1E2E;
            color: #FFFFFF;
            font-family: 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #8A86E6;
        }

        .container {
            display: none;
            flex-wrap: wrap;
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            flex: 1 0 300px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        @media (max-width: 700px) {
            .card {
                background-color: rgba(255, 255, 255, 0.05);
                border-radius: 16px;
                padding: 24px;
                flex: 0 0 100%;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            }
        }

        button {
            background-color: #E68A86;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }

        button:hover {
            background-color: #d87b77;
        }

        input[type="file"] {
            margin-bottom: 10px;
            color: #ccc;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            box-sizing: border-box;
            font-size: 18px;
            text-align: center;
            margin-top: 8px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background-color: rgba(0, 0, 0, 0.2);
            margin-bottom: 8px;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        a {
            color: #8A86E6;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

            a:hover {
                text-decoration: underline;
            }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            flex: 1 0 180px;
            min-width: 0;
        }

            .checkbox-label input {
                flex: 0 0 auto;
            }

        .file-name {
            flex: 1;
            min-width: 0;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .file-download {
            white-space: nowrap;
            min-width: fit-content;
            flex-shrink: 0;
            writing-mode: horizontal-tb;
            word-break: normal;
        }

        @media (max-width: 480px) {
            #fileList li {
                flex-direction: column;
                align-items: stretch;
            }

            .file-download {
                align-self: flex-end;
            }
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0 10px 0;
        }

        #authCard {
            max-width: 360px;
            width: 100%;
            margin-bottom: 20px;
        }

        #authStatus,
        #uploadStatus,
        #chatStatus {
            font-size: 12px;
            color: #E68A86;
        }

        .drop-zone {
            border: 2px dashed #8A86E6;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            background-color: rgba(138, 134, 230, 0.05);
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            margin-bottom: 15px;
        }

            .drop-zone.dragover {
                background-color: rgba(230, 138, 134, 0.15);
                border-color: #E68A86;
                transform: scale(1.02);
            }

            .drop-zone p {
                margin: 5px 0;
                font-size: 18px;
                font-weight: bold;
                color: #ccc;
            }

        .chat-card {
            flex: 1 1 100%;
        }

        .chat-window {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 360px;
            max-height: 520px;
            background: rgba(0, 0, 0, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 14px;
        }

        .chat-messages {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .chat-message-row {
            display: flex;
        }

        .chat-message-row.mine {
            justify-content: flex-end;
        }

        .chat-bubble {
            max-width: min(72%, 460px);
            padding: 10px 14px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.12);
            color: #FFFFFF;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }

        .chat-message-row.mine .chat-bubble {
            background: #8A86E6;
            border-bottom-right-radius: 4px;
        }

        .chat-message-row:not(.mine) .chat-bubble {
            border-bottom-left-radius: 4px;
        }

        .chat-input-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }

        #chatInput {
            flex: 1;
            min-height: 44px;
            max-height: 120px;
            resize: vertical;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.08);
            color: #FFFFFF;
            padding: 12px 14px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 15px;
            outline: none;
        }

        #chatInput:focus {
            border-color: #8A86E6;
        }

        .chat-send-button {
            width: 48px;
            height: 48px;
            margin-top: 0;
            padding: 0;
            border-radius: 50%;
            background: #8A86E6;
            font-size: 18px;
            flex: 0 0 auto;
        }

        .chat-send-button:hover {
            background: #7773d8;
        }

        @media (max-width: 560px) {
            body {
                padding: 24px 14px;
            }

            .card {
                padding: 18px;
            }

            .chat-bubble {
                max-width: 84%;
            }
        }
    </style>
</head>
<body>

<h1>🚀 Focus Wave 파일공유</h1>

<p id="connectionStatus" style="font-size: 18px; font-weight: bold; color: #FFD700;">
    🟡 폰과 연결 확인 중...
</p>

<div id="authCard" class="card">
    <h2>🔐 인증 코드 입력</h2>
    <p>폰 화면에 표시된 6자리 인증 코드를 입력하세요.</p>

    <input type="text"
           id="authCodeInput"
           maxlength="6"
           inputmode="numeric"
           placeholder="예: 123456">

    <button onclick="verifyCode()">접속하기</button>
    <p id="authStatus"></p>
</div>

<div class="container" id="fileShareContainer">
    <div class="card">
        <h2>💻 파일 업로드</h2>
        <p>폰으로 보낼 파일을 선택하거나 아래 영역에 끌어다 놓으세요.</p>

        <!-- 💡 새롭게 추가된 드롭존 영역 -->
        <div id="dropZone" class="drop-zone" onclick="document.getElementById('fileInput').click()">
            <p>📥 Drop files here!</p>
            <span style="font-size: 14px; color: #aaa;">(또는 클릭하여 파일 선택)</span>
            <!-- 기본 인풋은 display: none 으로 숨깁니다 -->
            <input type="file" id="fileInput" name="files" multiple style="display: none;">
        </div>

        <button onclick="uploadFile()">🚀 폰으로 전송</button>
        <p id="uploadStatus"></p>
    </div>

    <div class="card">
        <h2>📱 파일 다운로드</h2>
        <p>현재 폰에서 공유 중인 파일 목록입니다.</p>

        <div class="action-bar">
            <label class="checkbox-label">
                <input type="checkbox" id="selectAll" onchange="toggleSelectAll()"> 전체 선택
            </label>

            <button onclick="downloadSelected()" style="width: auto; margin-top: 0; padding: 8px 16px;">
                선택 다운로드 ⬇️
            </button>
        </div>

        <ul id="fileList">
            <li>아직 불러온 파일이 없습니다.</li>
        </ul>
    </div>

    <div class="card chat-card">
        <h2>💬 로컬 채팅</h2>
        <p>같은 Wi-Fi에 연결된 기기와 임시 메시지를 주고받는 공간입니다.</p>

        <div class="chat-window">
            <div id="chatMessages" class="chat-messages" aria-live="polite">
                <div class="chat-message-row">
                    <div class="chat-bubble">채팅 연결 준비 중입니다.</div>
                </div>
            </div>

            <div class="chat-input-row">
                <textarea id="chatInput" rows="1" placeholder="메시지 입력"></textarea>
                <button class="chat-send-button" onclick="sendChatMessage()" aria-label="메시지 보내기">➤</button>
            </div>
        </div>

        <p id="chatStatus"></p>
    </div>
</div>

<script type="module">
    import { x25519 } from "https://esm.sh/@noble/curves@1.9.7/ed25519?bundle";
    import { cbc, gcm } from "https://esm.sh/@noble/ciphers@1.3.0/aes?bundle";
    import { hkdf } from "https://esm.sh/@noble/hashes@1.8.0/hkdf?bundle";
    import { sha256 } from "https://esm.sh/@noble/hashes@1.8.0/sha2?bundle";

    let isAuthenticated = false;
    let fileListRefreshTimer = null;
    let clientPrivateKey = null;
    let clientPublicKey = null;
    let aesKeyBytes = null;
    let trustedDeviceEvents = null;
    let trustedDeviceClaimInProgress = false;
    const textEncoder = new TextEncoder();
    const textDecoder = new TextDecoder();

    const downloadState = {};
    let chatMessageId = 1;

    function updateDownloadBtnUI(fileName) {
        const btn = document.querySelector(
            `.file-download[data-filename="${fileName}"]`
        )
        const state = downloadState[fileName];
        if (state) {
                btn.textContent = state.text;
                btn.style.color = state.color;
                btn.style.pointerEvents = state.disabled ? "none" : "auto";
        } else {
                btn.textContent = "다운로드 ⬇️";
                btn.style.color = "";
                btn.style.pointerEvents = "auto";
        }
    }

    function bytesToBase64(bytes) {
        let binary = "";
        bytes.forEach(byte => { binary += String.fromCharCode(byte); });
        return btoa(binary);
    }

    function base64ToBytes(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
    }

    function randomBytes(length) {
        const bytes = new Uint8Array(length);
        crypto.getRandomValues(bytes);
        return bytes;
    }

    function deriveAesKey(sharedSecret) {
        return hkdf(  // HMAC-based Key Derivation Function
            sha256,  // HKDF에서 사용할 해시 함수
            sharedSecret,
            textEncoder.encode("FocusWave FileShare Salt"),   // 랜덤 Key Salt값
            textEncoder.encode("FocusWave ECDH AES-CBC v1"),  //
            32  // 출력 키 길이 32바이트 = 256비트
        );
    }

    async function setupEncryption() {
        clientPrivateKey = x25519.utils.randomPrivateKey();
        clientPublicKey = x25519.getPublicKey(clientPrivateKey);

        const response = await fetch("/crypto/exchange", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ clientPublicKey: bytesToBase64(clientPublicKey) })
        });

        if (!response.ok) throw new Error("Key exchange failed");

        const result = await response.json();
        const serverPublicKey = base64ToBytes(result.serverPublicKey);
        const sharedSecret = x25519.getSharedSecret(clientPrivateKey, serverPublicKey);

        aesKeyBytes = deriveAesKey(sharedSecret);
    }



    function pkcs7Pad(data) {
        const blockSize = 16;
        const padLength = blockSize - (data.length % blockSize);
        const padded = new Uint8Array(data.length + padLength);
        padded.set(data);
        padded.fill(padLength, data.length);
        return padded;
    }



    async function encryptFileName(fileName) {
        const nonce = randomBytes(12);
        const plainBytes = textEncoder.encode(fileName);
        if (plainBytes.length > 256) throw new Error("File name too long");
        const padded256Bytes = new Uint8Array(256);
        padded256Bytes.set(plainBytes);
        const finalPaddedBytes = pkcs7Pad(padded256Bytes);

        const aes = gcm(aesKeyBytes, nonce);
        const encryptedBytes = aes.encrypt(finalPaddedBytes);

        return {
            encryptedBase64: bytesToBase64(encryptedBytes),
            metaNonceBase64: bytesToBase64(nonce)
        };
    }


    function decryptFileName(encryptedBase64, nonceBase64) {
        const iv = base64ToBytes(nonceBase64);
        const encryptedBytes = base64ToBytes(encryptedBase64);

        const aes = cbc(aesKeyBytes, iv);
        const decryptedWithPadding = aes.decrypt(encryptedBytes);

        // 1. PKCS7 패딩 찌꺼기 우선 제거 (272바이트 -> 256바이트로 복원)
        const padded256Bytes = pkcs7Unpad(decryptedWithPadding);

        let actualLength = padded256Bytes.indexOf(0);
        if (actualLength === -1) actualLength = padded256Bytes.length;

        const plainBytes = padded256Bytes.slice(0, actualLength);

        return textDecoder.decode(plainBytes);
    }


async function encryptFile(file) {
    if (!aesKeyBytes) throw new Error("암호화 키가 없습니다.");

    // 브라우저 렌더링 멈춤 방지
    await new Promise(resolve => setTimeout(resolve, 100));

    // GCM에서는 일반적으로 12바이트 nonce 사용
    const nonce = randomBytes(12);

    // 파일 전체를 메모리에 읽음
    const plainBuffer = await file.arrayBuffer();
    const plainBytes = new Uint8Array(plainBuffer);

    // AES-GCM 암호화
    const aes = gcm(aesKeyBytes, nonce);
    const encryptedBytes = aes.encrypt(plainBytes);

    return {
        encryptedBlob: new Blob([encryptedBytes]),
        nonceBase64: bytesToBase64(nonce)
    };
}

    function pkcs7Unpad(data) {
        const padLength = data[data.length - 1];

        if (padLength < 1 || padLength > 16) {
            throw new Error("Invalid padding");
        }

        return data.slice(0, data.length - padLength);
    }

    // 💡 btnElement 파라미터 삭제
    async function downloadEncryptedFile(fileName) {
        if (!aesKeyBytes) {
            alert("보안 연결이 끊어졌습니다. 다시 인증해주세요.");
            resetAuth();
            return;
        }

        const metaCrypto = await encryptFileName(fileName);

        const encryptedUrlParam = encodeURIComponent(metaCrypto.encryptedBase64);
        const nonceUrlParam = encodeURIComponent(metaCrypto.metaNonceBase64);

        // 💡 장부 기록 및 UI 업데이트
        downloadState[fileName] = { text: "요청 중... ⏳", color: "#FFD700", disabled: true };
        updateDownloadBtnUI(fileName);

        const response = await fetch(`/download/${encryptedUrlParam}?nonce=${nonceUrlParam}`, {
            method: "GET",
            credentials: "same-origin"
        });

        if (!response.ok) {
            alert(`다운로드 실패: ${response.status}`);
            downloadState[fileName] = { text: "실패 ❌", color: "#F44336", disabled: true };
            updateDownloadBtnUI(fileName);
            return;
        }

        const nonceBase64 = response.headers.get("X-FocusWave-Nonce");
        if (!nonceBase64) {
            alert("다운로드 복호화 정보가 없습니다.");
            return;
        }
        const metaEncryptedBase64 = response.headers.get("X-File-Name-Encrypted");
        const metaNonceBase64 = response.headers.get("X-Meta-Nonce");

        let actualFileName = fileName;
        if (metaEncryptedBase64 && metaNonceBase64) {
            try {
                actualFileName = decryptFileName(metaEncryptedBase64, metaNonceBase64);
            } catch (e) {
                console.error("파일명 복호화 에러:", e);
            }
        }

        const iv = base64ToBytes(nonceBase64);
        const contentLength = response.headers.get('Content-Length');
        const totalBytes = parseInt(contentLength, 10);
        let loadedBytes = 0;

        const reader = response.body.getReader();
        const chunks = [];

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            chunks.push(value);
            loadedBytes += value.length;

            const percent = Math.round((loadedBytes / totalBytes) * 100);

            // 💡 퍼센트 업데이트
            downloadState[fileName] = { text: `다운로드 중 ${percent}%`, color: "#FFD700", disabled: true };
            updateDownloadBtnUI(fileName);
        }

        const encryptedBytes = new Uint8Array(loadedBytes);
        let offset = 0;
        for (const chunk of chunks) {
            encryptedBytes.set(chunk, offset);
            offset += chunk.length;
        }

        try {
            const aes = cbc(aesKeyBytes, iv);
            const paddedPlainBytes = aes.decrypt(encryptedBytes);

            // 주석 유지
            // const plainBytes = pkcs7Unpad(paddedPlainBytes);
            const plainBytes = paddedPlainBytes;

            const blob = new Blob([plainBytes], {
                type: response.headers.get("Content-Type") || "application/octet-stream"
            });

            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = actualFileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);


            downloadState[fileName] = { text: "다운로드 ✅", color: "#4CAF50", disabled: false };
            updateDownloadBtnUI(fileName);

        } catch (error) {
            console.error("복호화 또는 패딩 제거 중 에러 발생:", error);
            downloadState[fileName] = { text: "에러 ❌", color: "#F44336", disabled: true };
            updateDownloadBtnUI(fileName);
        }
    }

    async function verifyCode() {
        const codeInput = document.getElementById('authCodeInput');
        const authStatus = document.getElementById('authStatus');
        const code = codeInput.value.trim();

        if (code.length !== 6) {
            authStatus.innerText = "6자리 인증 코드를 입력해주세요.";
            return;
        }

        authStatus.innerText = "인증 중...";

        try {
            const response = await fetch('/auth', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: code })
            });

            if (response.ok) {
                authStatus.innerText = "보안 연결 설정 중...";
                await setupEncryption();
                enterAuthenticatedState();

            } else {
                let errorData;
                try {
                    errorData = await response.json();
                } catch (e) {
                    errorData = null;
                }

                if (errorData && errorData.message) {
                    authStatus.innerText = errorData.message;
                } else {
                    if (response.status === 401) {
                        authStatus.innerText = "인증 코드가 올바르지 않습니다.";
                    } else if (response.status === 403) {
                        authStatus.innerText = "영구 차단됨: 서버가 재시작될 때까지 접속할 수 없습니다.";
                    } else if (response.status === 429) {
                        authStatus.innerText = "요청 횟수 초과: 1분 뒤에 다시 시도해주세요.";
                    } else {
                        authStatus.innerText = `인증 실패: 서버 에러 (${response.status})`;
                    }
                }
            }
        } catch (error) {
            authStatus.innerText = "서버(폰)에 연결할 수 없습니다. Wi-Fi 상태를 확인해 주세요.";
        }
    }

    function enterAuthenticatedState() {
        isAuthenticated = true;
        clearFileShareUi();
        clearChatUi();

        document.getElementById('authCard').style.display = "none";
        document.getElementById('fileShareContainer').style.display = "flex";

        fetchFileList();

        if (fileListRefreshTimer !== null) {
            clearInterval(fileListRefreshTimer);
        }

        fileListRefreshTimer = setInterval(() => {
            fetchFileList();
        }, 2000);

        startTrustedDeviceEvents();
    }

    async function tryTrustedAuth() {
        try {
            const response = await fetch("/auth/trusted", {
                method: "POST",
                credentials: "same-origin"
            });

            if (!response.ok) {
                console.info("Trusted auth skipped:", response.status);
                return false;
            }

            await setupEncryption();
            enterAuthenticatedState();
            console.info("Trusted auth succeeded");
            return true;
        } catch (error) {
            console.info("Trusted auth failed:", error);
            return false;
        }
    }

    async function uploadFile() {
        if (!isAuthenticated) {
            alert("먼저 인증 코드를 입력해주세요.");
            return;
        }

        const fileInput = document.getElementById('fileInput');
        const statusText = document.getElementById('uploadStatus');
        const files = Array.from(fileInput.files);

        if (files.length === 0) {
            alert("파일을 먼저 선택해주세요!");
            return;
        }

        let successCount = 0;

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const success = await uploadOneFile(file, i + 1, files.length, statusText);
            if (!success) return;
            successCount++;
        }

        statusText.innerText = `${successCount}개 파일 전송 성공!`;
        fileInput.value = "";
        fetchFileList();
    }

    function uploadOneFile(file, currentIndex, totalCount, statusText) {
        return new Promise(async (resolve) => {
            try {
                if (!aesKeyBytes) {
                    statusText.innerText = "보안 연결이 끊어졌습니다. 다시 인증해주세요.";
                    resetAuth();
                    return resolve(false);
                }

                statusText.innerText = `전송 준비 및 암호화 중... (${currentIndex}/${totalCount}) ${file.name}`;

                const metaCrypto = await encryptFileName(file.name);

                // 1. PC 메모리에서 통짜 암호화 수행
                const encryptedFile = await encryptFile(file);

                const xhr = new XMLHttpRequest();
                xhr.open("POST", "/upload", true); // URL 파라미터 다 뺍니다.
                xhr.withCredentials = true;

                // 💡 2. 코틀린 서버가 읽을 수 있도록 메타데이터를 HTTP 헤더에 쌩으로 실어줍니다.
                xhr.setRequestHeader("Content-Type", "application/octet-stream"); // 멀티파트 아님!
                xhr.setRequestHeader("X-File-Name-Encrypted", metaCrypto.encryptedBase64);
                xhr.setRequestHeader("X-Meta-Nonce", metaCrypto.metaNonceBase64);
                xhr.setRequestHeader("X-FocusWave-Nonce", encryptedFile.nonceBase64);

                xhr.upload.onprogress = function (event) {
                    if (event.lengthComputable) {
                        const percent = Math.round((event.loaded / event.total) * 100);
                        statusText.innerText = `전송 중... (${currentIndex}/${totalCount}) ${file.name} - ${percent}%`;
                    }
                };

                xhr.onload = function () {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        statusText.innerText = `전송 완료! (${currentIndex}/${totalCount}) ${file.name}`;
                        resolve(true);
                    } else {
                        statusText.innerText = `전송 실패: 서버 에러 (${xhr.status})`;
                        resolve(false);
                    }
                };

                xhr.onerror = function () {
                    statusText.innerText = `서버 연결 실패`;
                    resolve(false);
                };

                // 💡 FormData로 감싸지 않고 암호화된 순수 덩어리(Blob)만 네트워크로 밀어 넣습니다.
                xhr.send(encryptedFile.encryptedBlob);

            } catch (error) {
                statusText.innerText = `암호화 또는 전송 실패`;
                resolve(false);
            }
        });
    }

    function toggleSelectAll() {
        const selectAllCheckbox = document.getElementById('selectAll');
        const checkboxes = document.querySelectorAll('.file-checkbox');

        checkboxes.forEach(cb => {
            cb.checked = selectAllCheckbox.checked;
        });
    }

    function downloadSelected() {
        if (!isAuthenticated) {
            alert("먼저 인증 코드를 입력해주세요.");
            return;
        }

        const checkboxes = document.querySelectorAll('.file-checkbox:checked');

        if (checkboxes.length === 0) {
            alert("다운로드할 파일을 체크해주세요!");
            return;
        }

        checkboxes.forEach((cb, index) => {
            setTimeout(() => {
                downloadEncryptedFile(cb.value);
            }, index * 300);
        });
    }

    async function fetchFileList() {
        if (!isAuthenticated) return;

        const listElement = document.getElementById('fileList');
        const selectAllCheckbox = document.getElementById('selectAll');

        try {
            const response = await fetch('/list', { credentials: 'same-origin' });

            if (response.ok) {
                const files = await response.json();

                const checkedFiles = Array.from(document.querySelectorAll('.file-checkbox:checked')).map(cb => cb.value);
                const isSelectAllchecked = selectAllCheckbox ? selectAllCheckbox.checked : false;

                listElement.innerHTML = "";

                if (selectAllCheckbox) selectAllCheckbox.checked = isSelectAllchecked;

                if (files.length === 0) {
                    listElement.innerHTML = "<li>폰에 공유 중인 파일이 없습니다.</li>";
                    return;
                }

                files.slice().reverse().forEach(fileName => {
                    const li = document.createElement('li');
                    const label = document.createElement('label');
                    label.className = "checkbox-label";

                    const checkbox = document.createElement('input');
                    checkbox.type = "checkbox";
                    checkbox.className = "file-checkbox";
                    checkbox.value = fileName;

                    if (checkedFiles.includes(fileName)) {
                        checkbox.checked = true;
                    }

                    const fileNameText = document.createElement('span');
                    fileNameText.className = "file-name";
                    fileNameText.textContent = fileName;

                    label.appendChild(checkbox);
                    label.appendChild(fileNameText);

                    const downloadBtn = document.createElement('a');
                    downloadBtn.href = "#";
                    downloadBtn.textContent = "다운로드 ⬇️";
                    downloadBtn.className = "file-download";

                    downloadBtn.setAttribute('data-filename', fileName);
                    const state = downloadState[fileName];
                    if (state) {
                        downloadBtn.textContent = state.text;
                        downloadBtn.style.color = state.color;
                        downloadBtn.style.pointerEvents = state.disabled ? "none" : "auto";
                    }

                    downloadBtn.onclick = function (event) {
                        event.preventDefault();
                        downloadEncryptedFile(fileName);
                    };

                    li.appendChild(label);
                    li.appendChild(downloadBtn);
                    listElement.appendChild(li);
                });
            } else if (response.status === 401 || response.status === 403) {
                listElement.innerHTML = "<li>인증이 만료되었거나 권한이 없습니다.</li>";
                resetAuth();
            } else {
                listElement.innerHTML = "<li>파일 목록을 가져오지 못했습니다.</li>";
            }
        } catch (error) {
            listElement.innerHTML = "<li>서버(폰)에서 목록을 가져올 수 없습니다.</li>";
        }
    }

    async function checkConnection() {
        const statusElement = document.getElementById('connectionStatus');
        const ipAddress = window.location.hostname || "로컬";

        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 2000);
            const response = await fetch('/ping', { signal: controller.signal });
            clearTimeout(timeoutId);

            if (response.ok) {
                statusElement.innerHTML = `🟢 폰(${ipAddress})과 정상적으로 연결됨`;
                statusElement.style.color = "#4CAF50";
            } else {
                throw new Error("서버 응답 오류");
            }
        } catch (error) {
            statusElement.innerHTML = `🔴 폰(${ipAddress})과 연결이 끊어졌습니다!`;
            statusElement.style.color = "#F44336";
        }
    }

    function resetAuth() {
        isAuthenticated = false;
        clientPrivateKey = null;
        clientPublicKey = null;
        aesKeyBytes = null;

        if (trustedDeviceEvents !== null) {
            trustedDeviceEvents.close();
            trustedDeviceEvents = null;
        }

        if (fileListRefreshTimer !== null) {
            clearInterval(fileListRefreshTimer);
            fileListRefreshTimer = null;
        }
        clearFileShareUi();

        document.getElementById('authCard').style.display = "block";
        document.getElementById('fileShareContainer').style.display = "none";
        document.getElementById('authCodeInput').value = "";
        document.getElementById('authStatus').innerText = "다시 인증해주세요.";
    }

    function clearFileShareUi() {
        const fileInput = document.getElementById('fileInput');
        const uploadStatus = document.getElementById('uploadStatus');
        const fileList = document.getElementById('fileList');
        const selectAllCheckbox = document.getElementById('selectAll');

        if (fileInput) fileInput.value = "";
        if (uploadStatus) uploadStatus.innerText = "";
        if (selectAllCheckbox) selectAllCheckbox.checked = false;

        if (fileList) {
            fileList.innerHTML = "<li>아직 불러온 파일이 없습니다.</li>";
        }
    }

    function clearChatUi() {
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const chatStatus = document.getElementById('chatStatus');

        chatMessageId = 1;

        if (chatInput) chatInput.value = "";
        if (chatStatus) chatStatus.innerText = "";

        if (chatMessages) {
            chatMessages.innerHTML = "";
            appendChatMessage("채팅 연결 준비 중입니다.", false);
        }
    }

    function appendChatMessage(text, isMine) {
        const chatMessages = document.getElementById('chatMessages');
        if (!chatMessages) return;

        const row = document.createElement('div');
        row.className = isMine ? "chat-message-row mine" : "chat-message-row";
        row.dataset.messageId = String(chatMessageId++);

        const bubble = document.createElement('div');
        bubble.className = "chat-bubble";
        bubble.textContent = text;

        row.appendChild(bubble);
        chatMessages.appendChild(row);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function sendChatMessage() {
        if (!isAuthenticated) {
            alert("먼저 인증 코드를 입력해주세요.");
            return;
        }

        const chatInput = document.getElementById('chatInput');
        const chatStatus = document.getElementById('chatStatus');
        if (!chatInput) return;

        const message = chatInput.value.trim();
        if (!message) return;

        appendChatMessage(message, true);
        chatInput.value = "";

        if (chatStatus) {
            chatStatus.innerText = "채팅 서버 API 연결 전입니다. 현재 화면에만 표시됩니다.";
        }
    }

    function startTrustedDeviceEvents() {
        if (trustedDeviceEvents !== null) {
            trustedDeviceEvents.close();
        }
        trustedDeviceClaimInProgress = false;
        trustedDeviceEvents = new EventSource("/trusted-device/events");

        trustedDeviceEvents.onopen = () => {
            console.info("Trusted device event stream connected");
        };

        trustedDeviceEvents.addEventListener("trusted-device-approved", (event) => {
            console.info("Trusted device approved event received:", event.data);
            claimTrustedDevice();
        });

        trustedDeviceEvents.onmessage = (event) => {
            console.info("Trusted device event message received:", event.data);
            try {
                const data = JSON.parse(event.data);
                if (data.type === "trusted-device-approved") {
                    claimTrustedDevice();
                }
            } catch (error) {
                console.info("Trusted device event message ignored:", event.data);
            }
        };

        trustedDeviceEvents.onerror = () => {
            console.error("Trusted device event stream disconnected");
        };
    }

    async function claimTrustedDevice() {
        if (trustedDeviceClaimInProgress) return;
        trustedDeviceClaimInProgress = true;

        try {
            const response = await fetch("/trusted-device/claim", {
                method: "POST",
                credentials: "same-origin"
            });

            if (!response.ok) {
                console.error("Trusted device claim failed:", response.status);
                trustedDeviceClaimInProgress = false;
            } else {
                console.info("Trusted device claim succeeded");
            }
        } catch (error) {
            console.error("Trusted device claim failed:", error);
            trustedDeviceClaimInProgress = false;
        }
    }

    document.getElementById('authCodeInput').addEventListener('keyup', function (event) {
        if (event.key === "Enter") {
            verifyCode();
        }
    });

    window.verifyCode = verifyCode;
    window.uploadFile = uploadFile;
    window.toggleSelectAll = toggleSelectAll;
    window.downloadSelected = downloadSelected;
    window.downloadEncryptedFile = downloadEncryptedFile;
    window.sendChatMessage = sendChatMessage;
    tryTrustedAuth();
    checkConnection();
    setInterval(checkConnection, 3000);

    // --- 드래그 앤 드롭 영역 이벤트 처리 ---
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const uploadStatus = document.getElementById('uploadStatus');

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');

        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
            fileInput.files = e.dataTransfer.files;
            uploadStatus.innerText = `✅ ${fileInput.files.length}개의 파일이 선택되었습니다. 전송을 눌러주세요!`;
            uploadStatus.style.color = "#4CAF50"; // 초록색으로 변경
        }
    });

    // 클릭해서 파일을 선택했을 때도 피드백을 주기 위한 이벤트
    fileInput.addEventListener('change', () => {
        if (fileInput.files.length > 0) {
            uploadStatus.innerText = `✅ ${fileInput.files.length}개의 파일이 선택되었습니다. 전송을 눌러주세요!`;
            uploadStatus.style.color = "#4CAF50";
        }
    });

    const chatInput = document.getElementById('chatInput');
    if (chatInput) {
        chatInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendChatMessage();
            }
        });
    }
    // ------------------------------------
</script>
</body>
</html>
